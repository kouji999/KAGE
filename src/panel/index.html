<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1117'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='%232dd4bf' font-family='monospace'%3EK%3C/text%3E%3C/svg%3E">
<title>KAGE — Digital Shadow</title>
<style>
  /* universal: JS toggle el.hidden — pastikan selalu menang atas display:flex dsb */
  [hidden] { display: none !important; }
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #21262d;
    --border-soft: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-faint: #6e7681;
    --accent: #2dd4bf;
    --accent-dim: rgba(45, 212, 191, 0.12);
    --blue: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #a371f7;
    --mono: 'Cascadia Code', 'Consolas', 'SF Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

  /* ---- top bar ---- */
  .topbar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 0; border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: 0.5px; }
  .brand small { color: var(--text-dim); font-size: 11px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    border: 1px solid var(--border-soft);
  }
  .pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
  .pill.connected { color: var(--green); border-color: rgba(63,185,80,.4); background: rgba(63,185,80,.08); }
  .pill.connected::before { background: var(--green); }
  .pill.disconnected, .pill.connecting { color: var(--yellow); border-color: rgba(210,153,34,.4); background: rgba(210,153,34,.08); }
  .pill.disconnected::before, .pill.connecting::before { background: var(--yellow); }
  .pill.off, .pill.logged_out { color: var(--red); border-color: rgba(248,81,73,.4); background: rgba(248,81,73,.08); }
  .pill.off::before, .pill.logged_out::before { background: var(--red); }
  .pill.qr { color: var(--purple); border-color: rgba(163,113,247,.4); background: rgba(163,113,247,.08); }
  .pill.qr::before { background: var(--purple); }

  .seg { display: inline-flex; border: 1px solid var(--border-soft); border-radius: 8px; overflow: hidden; margin-left: auto; }
  .seg button {
    background: var(--surface); color: var(--text-dim);
    border: none; padding: 7px 14px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    border-right: 1px solid var(--border-soft);
  }
  .seg button:last-child { border-right: none; }
  .seg button:hover { color: var(--text); }
  .seg button.active { background: var(--accent-dim); color: var(--accent); }
  .seg button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 1px;
  }

  /* ---- layout ---- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .grid .wide { grid-column: 1 / -1; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px;
  }
  .card h2 {
    font-size: 12px; margin: 0 0 12px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .count {
    background: var(--border); color: var(--text);
    border-radius: 999px; font-size: 11px; padding: 0 8px; line-height: 18px;
  }

  /* ---- generic ---- */
  .btn {
    background: var(--border); color: var(--text);
    border: 1px solid var(--border-soft); border-radius: 6px;
    padding: 5px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .btn:hover { border-color: var(--text-faint); }
  .btn.primary { background: var(--accent-dim); border-color: rgba(45,212,191,.4); color: var(--accent); }
  .btn.primary:hover { background: rgba(45,212,191,.2); }
  .btn.danger { background: rgba(248,81,73,.1); border-color: rgba(248,81,73,.4); color: var(--red); }
  .btn.danger:hover { background: rgba(248,81,73,.2); }
  .btn.warn { background: rgba(210,153,34,.1); border-color: rgba(210,153,34,.4); color: var(--yellow); }
  .btn.warn:hover { background: rgba(210,153,34,.2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
  }
  .badge.LOW { background: var(--border); color: var(--text-dim); }
  .badge.MEDIUM { background: rgba(210,153,34,.15); color: var(--yellow); }
  .badge.HIGH { background: rgba(248,81,73,.15); color: var(--red); }
  .badge.taken { background: rgba(88,166,255,.15); color: var(--blue); }

  .empty { color: var(--text-faint); font-size: 13px; padding: 8px 0; }
  .loading { color: var(--text-faint); font-size: 13px; }
  .muted { color: var(--text-dim); font-size: 12px; }
  .mono { font-family: var(--mono); font-size: 12px; }

  /* ---- lock screen ---- */
  .lock-wrap { display: flex; justify-content: center; padding-top: 14vh; }
  .lock-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 28px; width: 100%; max-width: 360px; text-align: center;
  }
  .lock-card h2 { margin: 0 0 4px; font-size: 15px; }
  .lock-card p { margin: 0 0 16px; font-size: 12px; color: var(--text-dim); }
  .lock-card input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border-soft); border-radius: 6px;
    padding: 8px 10px; font-size: 13px; margin-bottom: 10px; font-family: var(--mono);
  }
  .lock-card button { width: 100%; padding: 8px; }

  /* ---- approval cards ---- */
  .approval { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--bg); }
  .approval .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .approval .who { font-weight: 600; font-size: 13px; }
  .approval .draft {
    font-family: var(--mono); font-size: 12px; color: var(--text-dim);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; margin: 6px 0 10px;
    white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow-y: auto;
  }
  .approval .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---- conversation list ---- */
  .conv {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; cursor: pointer; background: var(--bg);
    width: 100%; text-align: left; font-family: inherit; color: inherit; font-size: inherit;
  }
  .conv:hover { border-color: var(--border-soft); background: #1c2128; }
  .conv .who { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .when { color: var(--text-faint); font-size: 11px; white-space: nowrap; }

  /* ---- chat log ---- */
  .chat { display: flex; flex-direction: column; gap: 6px; max-height: 55vh; overflow-y: auto; padding: 4px 2px; }
  .msg { max-width: 78%; padding: 7px 11px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .msg.in { align-self: flex-start; background: var(--border); color: var(--text); border-bottom-left-radius: 3px; }
  .msg.out { align-self: flex-end; background: var(--accent-dim); color: var(--text); border: 1px solid rgba(45,212,191,.25); border-bottom-right-radius: 3px; }
  .msg .meta { display: block; font-size: 10px; color: var(--text-faint); margin-top: 3px; }

  /* ---- usage ---- */
  .usage-nums { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; }
  .usage-nums .n { font-size: 20px; font-weight: 700; font-family: var(--mono); }
  .usage-nums .l { font-size: 11px; color: var(--text-dim); }
  .bar { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
  .bar > div.hot { background: var(--yellow); }
  .bar > div.over { background: var(--red); }

  /* ---- notifications ---- */
  .notif { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .notif:last-child { border-bottom: none; }
  .notif.unread { color: var(--text); }
  .notif.read { color: var(--text-faint); }
  .notif .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex-shrink: 0; }
  .notif.read .dot { background: var(--border-soft); }
  .notif .txt { flex: 1; font-size: 12px; word-break: break-word; }
  .notif .kind { color: var(--blue); font-family: var(--mono); font-size: 11px; }

  /* ---- drawer / modal ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(1, 4, 9, .7);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .overlay[hidden] { display: none; }
  .drawer {
    background: var(--surface); border: 1px solid var(--border-soft); border-radius: 10px;
    width: 100%; max-width: 640px; max-height: 85vh; display: flex; flex-direction: column;
  }
  .drawer .dhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .drawer .dhead h3 { margin: 0; font-size: 14px; flex: 1; }
  .drawer .dbody { padding: 16px; overflow-y: auto; }
  .drawer .dfoot { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .edit-area { width: 100%; min-height: 130px; background: var(--bg); color: var(--text); border: 1px solid var(--border-soft); border-radius: 6px; padding: 10px; font-family: var(--mono); font-size: 13px; resize: vertical; }

  /* ---- toast ---- */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #1c2128; color: var(--text); border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 10px 18px; font-size: 13px; z-index: 99;
    opacity: 0; transition: transform .25s ease, opacity .25s ease;
    max-width: 90vw; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.err { border-color: rgba(248,81,73,.5); }
  #toast.ok { border-color: rgba(63,185,80,.5); }

  /* ---- qr ---- */
  .qr-box {
    font-family: var(--mono); font-size: 11px; color: var(--purple);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; white-space: pre-wrap; word-break: break-all; max-height: 110px; overflow-y: auto;
  }
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <div class="topbar">
    <div class="brand">
      <h1>KAGE — Digital Shadow</h1>
      <small>owner control panel</small>
    </div>
    <span class="pill" id="statusPill" title="connection status">…</span>
    <div class="seg" role="group" aria-label="Mode agent" id="modeSeg">
      <button data-mode="AUTO">AUTO</button>
      <button data-mode="ASSIST">ASSIST</button>
      <button data-mode="APPROVAL">APPROVAL</button>
      <button data-mode="OFF">OFF</button>
    </div>
  </div>

  <section class="card wide" id="qrCard" hidden>
    <h2>Session QR</h2>
    <p class="muted" id="qrNote"></p>
    <div class="qr-box" id="qrBox" hidden></div>
    <p style="margin-top:10px"><button class="btn" id="qrBtn">Ambil QR String</button></p>
  </section>

  <div class="grid">
    <section class="card" aria-label="Pending approvals">
      <h2>Pending Approvals <span class="count" id="apCount">0</span></h2>
      <div id="approvals"><span class="loading">…</span></div>
    </section>

    <section class="card" aria-label="Usage">
      <h2>Usage LLM Bulan Ini</h2>
      <div id="usage"><span class="loading">…</span></div>
    </section>

    <section class="card wide" aria-label="Conversations">
      <h2>Conversations</h2>
      <div id="convs"><span class="loading">…</span></div>
    </section>

    <section class="card wide" aria-label="Kirim pesan manual">
      <h2>Kirim Pesan</h2>
      <form id="sendForm" style="display:flex; flex-direction:column; gap:8px;">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <input id="sendPhone" type="text" inputmode="tel" placeholder="Nomor tujuan (mis. 089501903835)" style="flex:1; min-width:220px; padding:8px 10px; background:var(--bg); color:var(--text); border:1px solid var(--border-soft); border-radius:8px;" />
          <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); user-select:none;">
            <input id="sendVoice" type="checkbox" style="accent-color: var(--accent);" />
            Voice note
          </label>
        </div>
        <textarea id="sendBody" rows="2" placeholder="Isi pesan…" style="padding:8px 10px; background:var(--bg); color:var(--text); border:1px solid var(--border-soft); border-radius:8px; resize:vertical;"></textarea>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="btn primary" id="sendBtn" type="submit">Kirim</button>
          <span class="muted" id="sendNote" style="font-size:11px;"></span>
        </div>
      </form>
    </section>

    <section class="card wide" aria-label="Notifications">
      <h2>Notifications <span class="count" id="ntfCount">0</span></h2>
      <div id="notifs"><span class="loading">…</span></div>
    </section>
  </div>
</div>

<div class="lock-wrap" id="lock">
  <div class="lock-card">
    <h2>KAGE</h2>
    <p>Owner control panel. Masukkan bearer token untuk akses API.</p>
    <form id="lockForm">
      <label for="tokenInput" style="position:absolute;left:-9999px">Bearer token</label>
      <input type="password" id="tokenInput" placeholder="Bearer token" autocomplete="off">
      <button class="btn primary" type="submit">Save</button>
    </form>
  </div>
</div>

<div class="overlay" id="drawer" hidden>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="dhead">
      <h3 id="drawerTitle">Conversation</h3>
      <button class="btn" id="drawerClose" aria-label="Tutup">✕</button>
    </div>
    <div class="dbody" id="drawerBody"></div>
    <div class="dfoot" id="drawerFoot"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
(function () {
  var TOKEN_KEY = 'kage_token';
  var token = localStorage.getItem(TOKEN_KEY) || null;
  var currentMode = null;
  var healthTimer = null;

  var $ = function (id) { return document.getElementById(id); };
  var appEl = $('app'), lockEl = $('lock');

  // ---- infra ----
  function toast(msg, cls) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'show' + (cls ? ' ' + cls : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ''; }, 3200);
  }

  function showLock() {
    token = null;
    localStorage.removeItem(TOKEN_KEY);
    appEl.hidden = true;
    lockEl.hidden = false;
    $('tokenInput').focus();
  }

  function showApp() {
    lockEl.hidden = true;
    appEl.hidden = false;
  }

  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: Object.assign(
        { 'Content-Type': 'application/json' },
        token ? { Authorization: 'Bearer ' + token } : {}
      ),
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (res) {
      if (res.status === 401) { showLock(); throw new Error('unauthorized'); }
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          throw new Error(data.error ? data.error + (data.detail ? ': ' + data.detail : '') : ('HTTP ' + res.status));
        }
        return data;
      });
    });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function relTime(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return iso;
    var s = Math.floor((Date.now() - d.getTime()) / 1000);
    if (s < 60) return 'baru saja';
    if (s < 3600) return Math.floor(s / 60) + 'm lalu';
    if (s < 86400) return Math.floor(s / 3600) + 'j lalu';
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
  }

  function contactName(jid) {
    return String(jid || '').split('@')[0] || jid;
  }

  // ---- health + mode ----
  function setPill(status) {
    var p = $('statusPill');
    var map = {
      connected: 'connected', disconnected: 'disconnected', connecting: 'disconnected',
      qr: 'qr', logged_out: 'off', off: 'off'
    };
    var cls = map[status] || 'disconnected';
    p.className = 'pill ' + cls;
    p.textContent = status;
  }

  function loadHealth() {
    return api('GET', '/api/v1/health').then(function (h) {
      setPill(h.status);
      var qrCard = $('qrCard');
      if (h.status === 'qr') {
        qrCard.hidden = false;
        $('qrNote').textContent = 'Scan QR di terminal untuk connect. QR juga bisa diambil di bawah.';
      } else if (h.status === 'logged_out') {
        qrCard.hidden = false;
        $('qrNote').textContent = 'Session logged out — hapus folder auth lalu restart KAGE.';
        $('qrBox').hidden = true;
      } else {
        qrCard.hidden = true;
      }
      return h;
    });
  }

  function loadMode() {
    return api('GET', '/api/v1/settings').then(function (s) {
      if (s.mode !== currentMode) {
        currentMode = s.mode;
        var btns = $('modeSeg').querySelectorAll('button');
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.toggle('active', btns[i].getAttribute('data-mode') === currentMode);
        }
      }
    });
  }

  $('modeSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var mode = btn.getAttribute('data-mode');
    api('PUT', '/api/v1/settings/mode', { mode: mode }).then(function () {
      currentMode = null; // force re-render active state
      loadMode();
      toast('Mode → ' + mode, 'ok');
    }).catch(function (err) { toast(err.message, 'err'); });
  });

  // ---- kirim pesan manual (teks / voice) ----
  $('sendForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var phone = $('sendPhone').value.trim();
    var body = $('sendBody').value.trim();
    var voice = $('sendVoice').checked;
    var note = $('sendNote');
    if (!phone || !body) { note.textContent = 'Nomor & isi pesan wajib.'; return; }
    $('sendBtn').disabled = true;
    note.textContent = 'mengirim…';
    api('POST', '/api/v1/send', { phone: phone, body: body, voice: voice })
      .then(function () {
        note.textContent = 'terkirim ke antrean.';
        $('sendBody').value = '';
        toast(voice ? 'Voice note dikirim.' : 'Pesan terkirim.', 'ok');
      })
      .catch(function (err) {
        note.textContent = '';
        toast('Gagal kirim: ' + err.message, 'err');
      })
      .finally(function () { $('sendBtn').disabled = false; });
  });

  // ---- approvals ----
  function loadApprovals() {
    return api('GET', '/api/v1/approvals').then(function (r) {
      var list = r.pending || [];
      $('apCount').textContent = list.length;
      var el = $('approvals');
      if (!list.length) {
        el.innerHTML = '<div class="empty">No pending approvals — semua aman.</div>';
        return;
      }
      el.innerHTML = '';
      list.forEach(function (a) {
        var card = document.createElement('div');
        card.className = 'approval';
        var head = document.createElement('div');
        head.className = 'head';
        head.innerHTML =
          '<span class="who">' + esc(contactName(a.contact_jid)) + '</span>' +
          '<span class="badge ' + esc(a.risk_level) + '">' + esc(a.risk_level) + '</span>' +
          '<span class="muted">' + esc(relTime(a.created_at)) + '</span>';
        var draft = document.createElement('div');
        draft.className = 'draft';
        draft.textContent = a.draft_body;
        var actions = document.createElement('div');
        actions.className = 'actions';
        var mk = function (label, cls, fn) {
          var b = document.createElement('button');
          b.className = 'btn ' + cls;
          b.textContent = label;
          b.addEventListener('click', fn);
          return b;
        };
        actions.appendChild(mk('Approve', 'primary', function () { decide(a, 'approve'); }));
        actions.appendChild(mk('Reject', 'danger', function () { decide(a, 'reject'); }));
        actions.appendChild(mk('Edit', 'warn', function () { openEdit(a); }));
        actions.appendChild(mk('Take over', '', function () { decide(a, 'takeover'); }));
        card.appendChild(head);
        card.appendChild(draft);
        card.appendChild(actions);
        el.appendChild(card);
      });
    });
  }

  function decide(a, action) {
    var p = api('POST', '/api/v1/approvals/' + a.id + '/' + action);
    p.then(function (res) {
      if (action === 'takeover' && res.note) toast(res.note, 'ok');
      else toast('Approval #' + a.id + ' → ' + action, 'ok');
      refresh(false);
    }).catch(function (err) { toast(err.message, 'err'); });
  }

  function openEdit(a) {
    $('drawerTitle').textContent = 'Edit draft — approval #' + a.id;
    var body = $('drawerBody');
    body.innerHTML = '';
    var label = document.createElement('label');
    label.htmlFor = 'editArea';
    label.className = 'muted';
    label.textContent = 'Pesan (draft untuk ' + contactName(a.contact_jid) + ')';
    var ta = document.createElement('textarea');
    ta.id = 'editArea';
    ta.className = 'edit-area';
    ta.value = a.draft_body;
    body.appendChild(label);
    body.appendChild(document.createElement('br'));
    body.appendChild(ta);
    var foot = $('drawerFoot');
    foot.innerHTML = '';
    var cancel = document.createElement('button');
    cancel.className = 'btn';
    cancel.textContent = 'Batal';
    cancel.addEventListener('click', closeDrawer);
    var save = document.createElement('button');
    save.className = 'btn primary';
    save.textContent = 'Kirim hasil edit';
    save.addEventListener('click', function () {
      var v = ta.value.trim();
      if (!v) { toast('Draft kosong', 'err'); return; }
      api('POST', '/api/v1/approvals/' + a.id + '/edit', { body: v }).then(function () {
        closeDrawer();
        toast('Draft teredit dikirim', 'ok');
        refresh(false);
      }).catch(function (err) { toast(err.message, 'err'); });
    });
    foot.appendChild(cancel);
    foot.appendChild(save);
    openDrawer();
    ta.focus();
  }

  // ---- conversations ----
  function loadConvs() {
    return api('GET', '/api/v1/conversations?limit=50').then(function (r) {
      var list = r.conversations || [];
      var el = $('convs');
      if (!list.length) {
        el.innerHTML = '<div class="empty">Belum ada percakapan.</div>';
        return;
      }
      el.innerHTML = '';
      list.forEach(function (c) {
        var row = document.createElement('button');
        row.type = 'button';
        row.className = 'conv';
        row.innerHTML =
          '<span class="who">' + esc(contactName(c.contact_jid)) + '</span>' +
          (c.taken_over ? '<span class="badge taken">taken over</span>' : '') +
          '<span class="when">' + esc(relTime(c.last_activity_at)) + '</span>';
        row.addEventListener('click', function () { openConv(c.id); });
        el.appendChild(row);
      });
    });
  }

  function openConv(id) {
    api('GET', '/api/v1/conversations/' + id).then(function (r) {
      $('drawerTitle').textContent = contactName(r.conversation.contact_jid) + ' — conversation #' + r.conversation.id;
      var body = $('drawerBody');
      body.innerHTML = '';
      var chat = document.createElement('div');
      chat.className = 'chat';
      var msgs = r.messages || [];
      if (!msgs.length) {
        chat.innerHTML = '<div class="empty">Belum ada pesan.</div>';
      }
      msgs.forEach(function (m) {
        var d = document.createElement('div');
        d.className = 'msg ' + (m.direction === 'in' ? 'in' : 'out');
        d.textContent = m.body;
        var meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = (m.direction === 'in' ? 'in' : 'out') + ' · ' + m.status + ' · ' + relTime(m.created_at);
        d.appendChild(meta);
        chat.appendChild(d);
      });
      body.appendChild(chat);
      var foot = $('drawerFoot');
      foot.innerHTML = '';
      if (r.conversation.taken_over) {
        var rel = document.createElement('button');
        rel.className = 'btn primary';
        rel.textContent = 'Release to KAGE';
        rel.addEventListener('click', function () {
          api('POST', '/api/v1/conversations/' + id + '/release').then(function () {
            closeDrawer();
            toast('Conversation dilepas ke KAGE', 'ok');
            refresh(false);
          }).catch(function (err) { toast(err.message, 'err'); });
        });
        foot.appendChild(rel);
      }
      openDrawer();
    }).catch(function (err) { if (err.message !== 'unauthorized') toast(err.message, 'err'); });
  }

  // ---- usage ----
  function loadUsage() {
    return api('GET', '/api/v1/reports/daily').then(function (r) {
      var m = r.usageMonth || {};
      var el = $('usage');
      var calls = m.calls || 0, cost = m.estCostUsd || 0;
      // budget dari settings
      return api('GET', '/api/v1/settings').then(function (s) {
        var b = (s.llm && s.llm.budgetUsd) || 0;
        var pct = b > 0 ? Math.min(100, (cost / b) * 100) : 0;
        var cls = pct >= 100 ? 'over' : (pct >= 75 ? 'hot' : '');
        el.innerHTML =
          '<div class="usage-nums">' +
            '<div><div class="n">' + calls + '</div><div class="l">calls</div></div>' +
            '<div><div class="n">$' + cost.toFixed(4) + '</div><div class="l">est cost bulan ini</div></div>' +
            '<div><div class="n">' + (r.today && r.today.messagesIn != null ? r.today.messagesIn : '—') + '</div><div class="l">messages hari ini</div></div>' +
          '</div>' +
          '<div class="muted" style="margin-bottom:6px">Budget: $' + cost.toFixed(4) + ' / $' + b + ' (' + Math.round(pct) + '%)</div>' +
          '<div class="bar"><div class="' + cls + '" style="width:' + pct + '%"></div></div>';
      });
    });
  }

  // ---- notifications ----
  function loadNotifs() {
    return api('GET', '/api/v1/notifications?limit=30').then(function (r) {
      var list = r.notifications || [];
      var unread = list.filter(function (n) { return !n.read; }).length;
      $('ntfCount').textContent = unread;
      var el = $('notifs');
      if (!list.length) {
        el.innerHTML = '<div class="empty">Tidak ada notifikasi.</div>';
        return;
      }
      el.innerHTML = '';
      list.forEach(function (n) {
        var row = document.createElement('div');
        row.className = 'notif ' + (n.read ? 'read' : 'unread');
        var dot = document.createElement('span');
        dot.className = 'dot';
        var txt = document.createElement('span');
        txt.className = 'txt';
        var payloadTxt = '';
        try {
          var p = JSON.parse(n.payload);
          var parts = [];
          for (var k in p) parts.push(k + '=' + p[k]);
          payloadTxt = parts.join(' · ');
        } catch (e) { payloadTxt = n.payload; }
        txt.innerHTML = '<span class="kind">' + esc(n.kind) + '</span> ' + esc(payloadTxt) +
          ' <span class="muted">· ' + esc(relTime(n.created_at)) + '</span>';
        if (!n.read) {
          var btn = document.createElement('button');
          btn.className = 'btn';
          btn.textContent = 'Read';
          btn.addEventListener('click', function () {
            api('POST', '/api/v1/notifications/' + n.id + '/read').then(function () {
              loadNotifs().catch(function () {});
            }).catch(function (err) { toast(err.message, 'err'); });
          });
          txt.appendChild(document.createTextNode(' '));
          txt.appendChild(btn);
        }
        row.appendChild(dot);
        row.appendChild(txt);
        el.appendChild(row);
      });
    });
  }

  // ---- drawer helpers ----
  function openDrawer() { $('drawer').hidden = false; }
  function closeDrawer() { $('drawer').hidden = true; }
  $('drawerClose').addEventListener('click', closeDrawer);
  $('drawer').addEventListener('click', function (e) { if (e.target === $('drawer')) closeDrawer(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('drawer').hidden) closeDrawer();
  });

  // ---- qr ----
  $('qrBtn').addEventListener('click', function () {
    api('POST', '/api/v1/session/qr').then(function (r) {
      var box = $('qrBox');
      if (r.qr) {
        box.hidden = false;
        box.textContent = r.qr;
      } else {
        box.hidden = false;
        box.textContent = '(QR belum tersedia — status: ' + r.status + ')';
      }
    }).catch(function (err) { toast(err.message, 'err'); });
  });

  // ---- refresh loop ----
  function refresh(showErrors) {
    var jobs = [
      loadHealth(), loadMode(), loadApprovals(), loadConvs(), loadUsage(), loadNotifs()
    ];
    jobs.forEach(function (p) {
      p.catch(function (err) {
        if (err.message !== 'unauthorized' && showErrors) toast(err.message, 'err');
      });
    });
  }

  function startPolling() {
    if (healthTimer) clearInterval(healthTimer);
    healthTimer = setInterval(function () {
      if (document.hidden) return; // skip saat tab tidak aktif
      refresh(false);
    }, 5000);
  }

  // ---- lock form ----
  $('lockForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('tokenInput').value.trim();
    if (!v) { toast('Token kosong', 'err'); return; }
    token = v;
    // probe: verifikasi token via /health
    api('GET', '/api/v1/health').then(function () {
      localStorage.setItem(TOKEN_KEY, v);
      showApp();
      refresh(true);
      startPolling();
    }).catch(function (err) {
      if (err.message === 'unauthorized') {
        toast('Token salah', 'err');
      } else { // API down — tetap masuk, polling akan retry
        localStorage.setItem(TOKEN_KEY, v);
        showApp();
        refresh(true);
        startPolling();
      }
    });
  });

  // ---- boot ----
  if (token) {
    showApp();
    refresh(true);
    startPolling();
  } else {
    showLock();
  }
})();
</script>
</body>
</html>
